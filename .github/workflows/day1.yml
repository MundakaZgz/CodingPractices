name: Day 1 - TypeScript Coding Practices
on:
  push:
    paths:
      - 'Day 1/**'
      - '.github/workflows/day1.yml'
  pull_request:
    paths:
      - 'Day 1/**'
      - '.github/workflows/day1.yml'
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Day 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Day 1/package-lock.json
      - run: npm ci
      - name: Run checks
        run: npm run check
